name: Demo environment CI

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "infra/**"
      - "compose.yaml"
      - ".github/workflows/demo-ci.yml"
  pull_request:
    paths:
      - "demo/**"
      - "infra/**"
      - "compose.yaml"
      - ".github/workflows/demo-ci.yml"

permissions:
  contents: read

concurrency:
  group: demo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: demo/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest

  stack:
    name: stack smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke check
        run: python demo/tools/smoke_check.py --wait 180

      - name: Exercise fault tooling
        run: |
          python demo/tools/incidentctl.py deploy inventory 9.9.9 --latency-ms 100
          python demo/tools/incidentctl.py status
          python demo/tools/incidentctl.py clear

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Stop stack
        if: always()
        run: docker compose down -v
