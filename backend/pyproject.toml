[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-intelligence-backend"
version = "0.1.0"
description = "Backend API for the AI Incident Intelligence Platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.161,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.28,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx2>=2.0,<3.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the demo stack; run them with `pytest -m integration`.
addopts = "-ra -m 'not integration'"
markers = ["integration: requires the running demo stack (docker compose up)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
