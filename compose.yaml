# Local demo stack: synthetic services, telemetry backends, and the platform database.
#
#   cp .env.example .env                  # once; set POSTGRES_PASSWORD
#   docker compose up -d --build          # core stack
#   docker compose --profile ui up -d     # also start OpenSearch Dashboards
#
# For local use only: security is disabled on OpenSearch and the admin APIs are
# unauthenticated, so every published port is bound to 127.0.0.1.

name: incident-intel

x-shop-service: &shop-service
  image: incident-intel/demo-shop:dev
  build: ./demo
  restart: unless-stopped
  depends_on:
    - otel-collector
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

x-shop-env: &shop-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_BSP_SCHEDULE_DELAY: "2000"
  # Use the stable HTTP semantic conventions (e.g. http_server_request_duration_seconds).
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  DEPLOYMENT_ENVIRONMENT: local-demo
  ORDERS_URL: http://orders:8000
  INVENTORY_URL: http://inventory:8000

services:
  # --- Demo application -------------------------------------------------------
  gateway:
    <<: *shop-service
    command: ["serve", "gateway"]
    environment:
      <<: *shop-env
      SERVICE_VERSION: "1.4.2"
      # Longer than orders' own downstream timeout, so orders' errors propagate.
      DOWNSTREAM_TIMEOUT_S: "3.0"
    ports: ["127.0.0.1:8080:8000"]

  orders:
    <<: *shop-service
    command: ["serve", "orders"]
    environment:
      <<: *shop-env
      SERVICE_VERSION: "2.7.0"
    ports: ["127.0.0.1:8081:8000"]

  inventory:
    <<: *shop-service
    command: ["serve", "inventory"]
    environment:
      <<: *shop-env
      SERVICE_VERSION: "3.1.5"
    ports: ["127.0.0.1:8082:8000"]

  loadgen:
    image: incident-intel/demo-shop:dev
    build: ./demo
    restart: unless-stopped
    command: ["loadgen", "--target", "http://gateway:8000", "--rps", "${LOADGEN_RPS:-2}"]
    depends_on:
      gateway:
        condition: service_healthy

  # --- Telemetry pipeline -----------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.3.0
    restart: unless-stopped
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./infra/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # --- Platform database ------------------------------------------------------
  # Host port 5433 avoids clashing with other local Postgres instances on 5432.
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidents
      POSTGRES_DB: incidents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: installs index templates before any data is written.
  opensearch-init:
    image: opensearchproject/opensearch:2.19.1
    entrypoint: ["/bin/bash", "/init/init.sh"]
    environment:
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ./infra/opensearch:/init:ro
    depends_on:
      opensearch:
        condition: service_healthy

  opensearch-dashboards:
    profiles: [ui]
    image: opensearchproject/opensearch-dashboards:2.19.1
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy
    ports: ["127.0.0.1:5601:5601"]

volumes:
  prometheus-data:
  opensearch-data:
  postgres-data:
