global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Application metrics, exported by services via OTLP and exposed by the collector.
  - job_name: otel-collector
    honor_labels: true  # keep the job/instance labels derived from service.name
    static_configs:
      - targets: ["otel-collector:8889"]
